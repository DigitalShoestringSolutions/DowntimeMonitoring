# This file defines the questions that will be asked to generate a user configuration file.
# Each question has a unique key, a type, and other parameters depending on the type.
# The criteria field is used to determine when a question should be asked, based on previous answers.
# Criteria can use 'and' (&) and 'or' (|) operators, and parentheses for grouping.
# for example: criteria = "a=1 & (b=2 | b=3)" means the question 
# will be asked if the 'a' is '1' and the 'b' is either '2' or '3'.

# The value of a question can be referenced in the user configuration template using {{<key>}}.
# The following question types are supported:
# - text: free text input from the user
#     [Q.<key>]
#       type = "text"
#       criteria = "<criteria>"
#       prompt = "<prompt>"         # what the user is asked
# - select: user selects from a list of options
#     [Q.<key>]
#       type = "select"
#       criteria = "<criteria>"
#       prompt = "<prompt>"         # what the user is asked
#       # each option is defined as:
#       opt.<value> = "<option_text>" 
#       opt.<next_value> = "<next_option_text>"  

[Q.enabled]
  type = "bool"
  prompt = "Enable analysis module?"

[Q.sensorbroker]
  criteria = "enabled=true"
    type="text"
    prompt="MQTT broker name / IP address of where the sensor data can be found."

[Q.sensortopic]
  criteria = "enabled=true"
    type="text"
    prompt="MQTT topic containing the sensor data. Typically includes the machine name."

[Q.param]
  criteria = "enabled=true"
    type="text"
    prompt="Parameter in the MQTT message containing the numerical data to compare to the threshold."

[Q.thresh]
  criteria = "enabled=true"
    type="text"
    prompt="Threshold value. Above this, the machine is running."

[Q.smoothing_factor]
  criteria = "enabled=true"
    type="text"
    prompt="EMA smoothing factor (between 0 and 1) 1 is no smoothing. If signal noisy try 0.1."

[Q.debounce_seconds]
  criteria = "enabled=true"
    type="text"
    prompt="Number of seconds the threshold output needs to be stable for. (default: 0 seconds for no debounce)"

[Q.retransmit_interval_seconds]
  criteria = "enabled=true"
    type="text"
    prompt="How often the current state is resent when stable in seconds. (default 3600 for 10 minutes)."

[Q.machine_id]
  criteria = "enabled=true"
    type="text"
    prompt="UUID of the machine to create downtime events on. Get this from the admin page when the downtime monitoring solution is running."

[OUT.module_enabled_out]
  var = "enabled"

[OUT.sensor_broker]
var="sensorbroker"

[OUT.sensor_mqtt_topic]
var="sensortopic"

[OUT.mqtt_payload_json_key]
var="param"

[OUT.smoothing_factor]
var="smoothing_factor"

[OUT.debounce_seconds]
var="debounce_seconds"

[OUT.retransmit_interval_seconds]
var="retransmit_interval_seconds"

[OUT.threshold_value]
var="thresh"

[OUT.machine_uuid]
var = "machine_id"

# Note: The following lines are examples of how to reference the answers in the user configuration template.
# For example, in user_config.toml, you can use {{machine_name}} to insert the machine name provided by the user.
# module_config_file = "./module_config/{{module_config_file}}.toml"
# calculation.machine_name.config.machine = "{{machine_name}}"
# calculation.current_clamp.config.nominal_current = {{clamp_rating}}
